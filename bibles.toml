# The first entry with data is the default bible in both readers (dash_app
# and site/). WLC, SBLGNT and KJV lead; NASB was removed (Lockman copyright).

[[bibles]]
id = "wlc"
name = "Biblical Hebrew OT (WLC)"
lang = "he"
graded_csv = "out/wlc_graded.csv"
source = "data/wlc.txt"
# Phase 10 audio (local only; absent manifest/files degrade to no audio).
audio_manifest = "out/audio/wlc_manifest.json"
attribution = "Westminster Leningrad Codex (public domain) via the Open Scriptures Hebrew Bible. Original work of the Open Scriptures Hebrew Bible available at https://github.com/openscriptures/morphhb (CC BY 4.0, https://creativecommons.org/licenses/by/4.0/). Morpheme dividers removed."
audio_attribution = "Audio: Faith Comes By Hearing, https://www.faithcomesbyhearing.com (Hebrew OT set HBRHMTN1DA). Free of charge; played locally only, never redistributed."

