apiVersion: apps/v1
kind: Deployment
metadata:
  name: bible-reader
spec:
  # The HPA owns this number once it is running; this is only the value applied
  # at first create, before the HPA's first reconcile.
  replicas: 2
  # strategy and topologySpreadConstraints moved to the base: they apply
  # everywhere now that pods are stateless, not just in prod.
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bible-reader
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - bible.example.com
      secretName: bible-reader-tls
  rules:
    - host: bible.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Base name on purpose -- see the note in the dev overlay.
                name: bible-reader
                port:
                  name: http
