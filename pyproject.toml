[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-reader"
version = "0.1.0"
description = "Vocabulary-graded Bible reader: rank verses by comprehension rate for language learning."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "nltk>=3.8",
    "dash>=2.0",
    "gunicorn>=21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
lexical = ["wordfreq>=3"]
semantic = ["spacy>=3"]
e2e = ["playwright>=1.40"]

# Anchor pytest's rootdir here so it does not climb into a parent directory and
# load an unrelated conftest.py. importmode=importlib keeps test modules isolated.
[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--import-mode=importlib"
markers = [
    "lexical: tests requiring the [lexical] extra (wordfreq)",
    "semantic: tests requiring the [semantic] extra (spacy + en_core_web_md)",
    "e2e: browser smoke tests requiring the [e2e] extra (playwright + chromium) and exported site data",
]

[tool.setuptools]
py-modules = ["parser", "dash_app"]

[tool.ruff]
line-length = 100

# Pin the rule set explicitly. `ruff>=0.5` floats, and 0.16 widened the implicit
# default set (I, UP, SIM, BLE, RUF, ...), which turned `ruff check .` -- the
# gate every phase is verified against -- into a moving target. These four are
# ruff's historical defaults, the set this repo was written against.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
