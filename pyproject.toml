[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-reader"
version = "0.1.0"
description = "Vocabulary-graded Bible reader: rank verses by comprehension rate for language learning."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "nltk>=3.8",
    "dash>=2.0",
    "gunicorn>=21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
lexical = ["wordfreq>=3"]
semantic = ["spacy>=3"]
e2e = ["playwright>=1.40"]
# Postgres-backed read tracking (DATABASE_URL). An extra, not a core dep:
# dash_app imports psycopg_pool lazily inside _pool(), so a SQLite-only install
# never touches it. The Docker image DOES install these — see requirements.txt —
# because the Kubernetes deployment runs multiple replicas and SQLite on a
# shared volume cannot support more than one writer.
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
# Publishing the graded corpus to the Hub (scripts/export_dataset.py). Kept out
# of the core deps deliberately: the Dockerfile installs requirements.txt to
# serve the Dash app, and the Hub CLI has no runtime role there.
# No [cli] extra — huggingface-hub 1.x ships the `hf` console script in the
# base package, and asking for [cli] is a silent no-op that uv warns about.
dataset = ["huggingface-hub>=1.25.1"]

# Anchor pytest's rootdir here so it does not climb into a parent directory and
# load an unrelated conftest.py. importmode=importlib keeps test modules isolated.
[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--import-mode=importlib"
markers = [
    "lexical: tests requiring the [lexical] extra (wordfreq)",
    "semantic: tests requiring the [semantic] extra (spacy + en_core_web_md)",
    "e2e: browser smoke tests requiring the [e2e] extra (playwright + chromium) and exported site data",
    "postgres: read-tracking tests requiring the [postgres] extra and a reachable $TEST_DATABASE_URL",
]

[tool.setuptools]
py-modules = ["parser", "dash_app"]

[tool.ruff]
line-length = 100

# Pin the rule set explicitly. `ruff>=0.5` floats and 0.16 widened the implicit
# default set, which turned `ruff check .` -- the gate every phase is verified
# against -- into a moving target: 51 findings on 0.16, zero on 0.15, same code.
# Naming the rules means the gate says the same thing on every ruff version.
#
# This is the wider set, adopted once the whole repo was clean against it.
# E4/E7/E9/F were the historical default; the rest are what 0.16 added and the
# codebase now passes.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "YTT", "BLE", "EXE", "UP", "I", "SIM", "FURB", "RUF", "ISC"]

# The ambiguous-unicode rules are noise in this repo, not signal: it is a
# multilingual Bible corpus, so Hebrew, Greek, Cyrillic and Arabic characters
# that these rules read as "confusable" with Latin are the actual subject
# matter. Leaving them on would mean 81 permanent false positives.
ignore = ["RUF001", "RUF002", "RUF003"]
